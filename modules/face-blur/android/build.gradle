apply plugin: 'com.android.library'

group = 'expo.modules.faceblur'
version = '1.0.0'

def expoModulesCorePlugin = new File(
  project(':expo-modules-core').projectDir.absolutePath,
  'ExpoModulesCorePlugin.gradle'
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace 'expo.modules.faceblur'

  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }

  sourceSets {
    main.assets.srcDirs += ["${projectDir}/../ios/Resources"]
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Keep this aligned with Expo Video. Mixing Media3 versions changes
  // interfaces such as LoadControl and crashes ExoPlayer at runtime.
  def androidxMedia3Version = '1.8.0'
  implementation "androidx.media3:media3-common:${androidxMedia3Version}"
  implementation "androidx.media3:media3-effect:${androidxMedia3Version}"
  implementation "androidx.media3:media3-transformer:${androidxMedia3Version}"
  implementation 'com.google.guava:guava:27.0.1-android'
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
}
